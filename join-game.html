<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SaladBowl</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/styles/main.scss" />
</head>
<body>
  <main>
    <div id="main-content">
      <form id="join-game-form" onsubmit="event.preventDefault()">
        <h1>Join a Game</h1>
        <hr>
        <input autocapitalize="characters" autocorrect="off" autocomplete="off" autofocus name="game-id" placeholder="Game Code" type="text">
        <button type="submit">Go</button>
        <a class="button" href="/">Back</a>
      </form>
    </div>
    <hr>
    <footer>
      <a href="/">Home</a>
      <a href="/how-to-play" target="_blank">How To Play</a>

      <div>
        <a target="_blank" href="https://github.com/simonbw/saladbowl-js">https://github.com/simonbw/saladbowl-js</a>
      </div>
    </footer>
  </main>
  <script type="module" src="/js/web/joinGamePage.ts"></script>
</body>
</html>
