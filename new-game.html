<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>New game · SaladBowl</title>
  <link rel="stylesheet" href="/styles/main.scss" />
</head>
<body>
  <div class="screen">
    <header class="app-header"><a href="/" class="logo-link"><!-- logo --></a></header>
    <form id="new-game-form" class="screen-form" onsubmit="event.preventDefault()">
      <h1 class="title">New game</h1>
      <div class="settings">
        <label class="setting">
          <span>Nouns per player</span>
          <input inputmode="numeric" max="100" min="1" name="wordsPerPlayer" type="number" value="5" />
        </label>
        <label class="setting">
          <span>Seconds per turn</span>
          <input inputmode="numeric" max="200" min="5" name="secondsPerRound" step="5" type="number" value="60" />
        </label>
      </div>
      <p class="form-error" id="new-game-error" hidden></p>
      <div class="spacer"></div>
      <button class="btn btn-primary" type="submit" autofocus>Create game</button>
    </form>
  </div>
  <script type="module" src="/js/web/newGamePage.ts"></script>
</body>
</html>
